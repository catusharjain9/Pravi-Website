<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">PRAVI founder finance illustration</title>
<desc id="desc">A calm editorial still life of a founder's workspace, with a laptop showing a clear cash-flow chart, a finance report, calculator and pencil in warm ivory, stone, charcoal and sunrise yellow.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#303030"/><stop offset="1" stop-color="#303030"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE000"/><stop offset="1" stop-color="#FFE000"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1" fill="#FFE000" opacity=".11"/><circle cx="19" cy="17" r=".8" fill="#FFE000" opacity=".09"/></pattern>
</defs>
<rect width="1200" height="1040" fill="url(#wall)"/>
<circle cx="1000" cy="150" r="260" fill="#FFE000" opacity=".42"/>
<circle cx="1000" cy="150" r="190" fill="none" stroke="#FFE000" stroke-width="2" opacity=".35"/>
<path d="M0 690 1200 540V1040H0Z" fill="url(#desk)"/>
<path d="M0 690 1200 540" fill="none" stroke="#FFE000" stroke-width="3" opacity=".4"/>
<rect width="1200" height="1040" fill="url(#grain)"/>
<ellipse cx="625" cy="785" rx="420" ry="100" fill="#303030" opacity=".2" filter="url(#shadow)"/>
<!-- laptop -->
<g transform="translate(300 190)">
  <path d="M55 45Q55 25 78 25H585Q608 25 608 47V410H55Z" fill="#303030"/>
  <rect x="75" y="48" width="513" height="335" rx="5" fill="url(#screen)"/>
  <rect x="98" y="72" width="468" height="288" fill="#FFFFFF"/>
  <rect x="98" y="72" width="468" height="50" fill="#303030"/>
  <circle cx="119" cy="96" r="4" fill="#FFE000"/><circle cx="134" cy="96" r="4" fill="#FFE000" opacity=".55"/>
  <rect x="153" y="91" width="96" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
  <rect x="118" y="144" width="155" height="11" rx="3" fill="#303030"/>
  <rect x="118" y="164" width="90" height="6" rx="3" fill="#303030"/>
  <rect x="118" y="196" width="185" height="132" fill="#FFFFFF"/>
  <path d="M135 301V218M168 301V254M201 301V235M234 301V204M267 301V225" stroke="#FFE000" stroke-width="16" stroke-linecap="butt"/>
  <path d="M323 294 358 267 391 277 428 218 464 230 514 174" fill="none" stroke="#303030" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M323 294 358 267 391 277 428 218 464 230 514 174V328H323Z" fill="#303030" opacity=".18"/>
  <path d="M322 312H526M322 275H526M322 238H526M322 201H526" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="118" y="341" width="113" height="5" rx="2.5" fill="#303030"/>
  <path d="M20 410H644L706 467Q712 478 694 480H-27Q-45 477-34 466Z" fill="#303030"/>
  <path d="M20 410H644L686 460H-14Z" fill="#FFFFFF"/>
  <path d="M255 419H430L413 440H272Z" fill="#303030"/>
  <path d="M-14 460H686" stroke="#303030" stroke-width="2" opacity=".55"/>
</g>
<!-- report sheet -->
<g transform="translate(130 515) rotate(-8)">
  <rect x="10" y="14" width="282" height="345" fill="#FFE000" opacity=".13"/>
  <rect width="282" height="345" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="25" y="25" width="130" height="10" rx="2" fill="#303030"/>
  <rect x="25" y="45" width="80" height="5" rx="2" fill="#303030"/>
  <rect x="25" y="79" width="232" height="1.5" fill="#FFFFFF"/>
  <rect x="25" y="101" width="75" height="7" rx="2" fill="#303030"/>
  <rect x="25" y="122" width="232" height="95" fill="#FFFFFF"/>
