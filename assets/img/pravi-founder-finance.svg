  <rect x="25" y="238" width="105" height="6" rx="2" fill="#303030"/>
  <rect x="25" y="256" width="210" height="4" rx="2" fill="#FFFFFF"/>
  <rect x="25" y="270" width="184" height="4" rx="2" fill="#FFFFFF"/>
