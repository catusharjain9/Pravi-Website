  <rect width="190" height="255" rx="10" fill="#303030"/>
  <rect x="18" y="18" width="154" height="53" rx="4" fill="#FFFFFF"/>
  <rect x="31" y="34" width="94" height="7" rx="3" fill="#303030"/>
  <rect x="31" y="48" width="124" height="5" rx="2" fill="#303030"/>
  <g fill="#FFFFFF">
    <rect x="18" y="89" width="32" height="29" rx="3"/><rect x="57" y="89" width="32" height="29" rx="3"/><rect x="96" y="89" width="32" height="29" rx="3"/><rect x="135" y="89" width="37" height="29" rx="3"/>
    <rect x="18" y="126" width="32" height="29" rx="3"/><rect x="57" y="126" width="32" height="29" rx="3"/><rect x="96" y="126" width="32" height="29" rx="3"/><rect x="135" y="126" width="37" height="29" rx="3"/>
    <rect x="18" y="163" width="32" height="29" rx="3"/><rect x="57" y="163" width="32" height="29" rx="3"/><rect x="96" y="163" width="32" height="29" rx="3"/><rect x="135" y="163" width="37" height="66" rx="3" fill="#FFE000"/>
    <rect x="18" y="200" width="32" height="29" rx="3"/><rect x="57" y="200" width="32" height="29" rx="3"/><rect x="96" y="200" width="32" height="29" rx="3"/>
  </g>
</g>
<!-- pencil -->
<g transform="translate(450 900) rotate(-18)">
  <rect width="270" height="13" rx="6" fill="#FFE000"/>
  <rect width="34" height="13" rx="5" fill="#303030"/>
  <path d="M270 0 292 6.5 270 13Z" fill="#FFE000"/>
  <path d="M285 5 292 6.5 285 8Z" fill="#303030"/>
</g>
<!-- sunlight edge -->
<path d="M840 0H1200V440L1030 500Z" fill="#FFFFFF" opacity=".3"/>
<path d="M0 870Q240 820 410 900T800 920" fill="none" stroke="#FFE000" stroke-width="2" opacity=".22"/>
</svg>