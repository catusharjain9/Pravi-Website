<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFBF3">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Connecting to Office Print | PRAVI Business Advisors LLP</title>
  <style>
    :root{color-scheme:light;--ink:#183e35;--muted:#66756e;--paper:#fffbf3;--yellow:#fff0c8;--line:#e4e7dc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);padding:clamp(25px,5vw,42px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 18px 60px rgba(24,62,53,.07)}
    .mark{display:inline-flex;align-items:center;gap:9px;font-size:.78rem;font-weight:850;letter-spacing:.12em;color:#315f50}
    .mark span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--yellow);font-size:1rem}
    h1{margin:25px 0 10px;font-size:clamp(1.8rem,5vw,2.55rem);line-height:1.08;letter-spacing:-.045em}
    p{color:var(--muted);line-height:1.7;margin:0}
    .status{margin-top:22px;padding:16px;border-radius:13px;background:#f5f7f1;border:1px solid var(--line);font-weight:650}
    .status[aria-live]{min-height:58px}
    .hint{font-size:.88rem;margin-top:15px}
    button{margin-top:20px;border:0;border-radius:999px;padding:12px 18px;background:#173f35;color:white;font:inherit;font-weight:750;cursor:pointer}
    button:focus-visible{outline:3px solid #d7a928;outline-offset:3px}
    .spinner{display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid #bfd0c4;border-top-color:#315f50;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark"><span aria-hidden="true">P</span> PRAVI BUSINESS ADVISORS</div>
    <h1>Connecting to Office Print</h1>
    <p>This page automatically finds the latest verified printer connection for the office computer.</p>
    <div class="status" id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Checking the office connection…</div>
    <p class="hint" id="hint">Keep the office printer PC switched on, connected to the internet and signed in to Windows.</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const retry = document.getElementById("retry");
      const recordUrl = "https://raw.githubusercontent.com/catusharjain9/Pravi-Website/office-print-state/office-print-url.json";
      let busy = false;
      async function connect() {
        if (busy) return;
        busy = true;
        retry.hidden = true;
        status.textContent = "Checking the latest office connection…";
        try {
          const response = await fetch(recordUrl + "?v=" + Date.now(), {cache:"no-store", credentials:"omit"});
          if (!response.ok) throw new Error("The connection record could not be reached.");
          const record = await response.json();
          const candidate = new URL(record.url || "");
          if (candidate.protocol !== "https:" || !/^[a-z0-9-]+\.trycloudflare\.com$/i.test(candidate.hostname) || candidate.hostname.toLowerCase() === "api.trycloudflare.com") {
            throw new Error("The office printer connection is not currently published.");
          }
          status.innerHTML = '<span class="spinner" aria-hidden="true"></span>Office connection found. Opening the print portal…';
          hint.textContent = "You will be taken to the printer's secure sign-in page.";
          window.location.replace(candidate.origin + "/login");
        } catch (error) {
          status.textContent = error && error.message ? error.message : "The office printer PC is not reachable yet.";
          hint.textContent = "Check that the printer PC is on and the Office Print services are running. Then try again.";
          retry.hidden = false;
        } finally {
          busy = false;
        }
      }
      retry.addEventListener("click", connect);
      connect();
    })();
  </script>
</body>
</html>
