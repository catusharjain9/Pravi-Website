name: Deploy PRAVI website to GitHub Pages

on:
  workflow_run:
    workflows: ["Website quality gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for production prerendering
        run: npx playwright install --with-deps chromium
      - name: Build, generate sitemap and prerender React routes
        run: npm run build
      - name: Upload production site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test deployed public routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -z "${PAGE_URL:-}" ]; then
            echo "GitHub Pages deployment did not return a page URL."
            exit 1
          fi
          base="${PAGE_URL%/}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          fetch_page() {
            curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "$1" --output "$body"
          }

          fetch_page "$base/"
          grep -qi '<title>PRAVI Business Advisors LLP' "$body"

          fetch_page "$base/who-we-help.html"
          grep -qi 'Who We Help' "$body"
          grep -qi 'manufacturing' "$body"
          grep -qi 'trading' "$body"

          fetch_page "$base/tools.html"
          grep -qi 'PRAVI' "$body"

          fetch_page "$base/robots.txt"
          grep -q 'Sitemap:' "$body"

          fetch_page "$base/sitemap.xml"
          grep -q 'who-we-help.html' "$body"

          status="$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "$base/__pravi-smoke-test-not-a-real-page__")"
          if [ "$status" != "404" ]; then
            echo "Expected an HTTP 404 for an unknown path, received $status."
            exit 1
          fi
          grep -qi 'Page not found' "$body"
          echo "GitHub Pages smoke test passed: homepage, sector route, legacy tools, robots, sitemap and branded 404."
