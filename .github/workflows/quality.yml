name: Website quality gates

on:
  push:
    branches: [main, audit-approved-design-refinement]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: HTML, asset, CSV and CSP checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit HTML structure and local references
        run: python scripts/quality-audit.py
      - name: Test PRAVI theme contrast and page overrides
        run: python scripts/test-theme-accessibility.py
      - name: Test approved PRAVI brand refinement layer
        run: python scripts/test-brand-refinement.py
      - name: Check depreciation calculator JavaScript syntax
        run: node --check assets/js/depreciation-calculator.js
      - name: Check currency converter JavaScript syntax
        run: node --check assets/js/currency-converter.js
      - name: Test depreciation calculation engine
        run: node scripts/test-depreciation-engine.mjs
      - name: Test currency conversion engine
        run: node scripts/test-currency-engine.mjs
      - name: Check depreciation engine JavaScript syntax
        run: node --check assets/js/depreciation-engine.js
      - name: Check currency engine JavaScript syntax
        run: node --check assets/js/currency-engine.js
      - name: Test CSV export safety
        run: node scripts/test-csv-safety.mjs
      - name: Test Content Security Policy JSON-LD hashes
        run: node scripts/test-csp-hashes.mjs
